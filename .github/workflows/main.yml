name: Build LifeTrack APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LifeTrack_Android_Project.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -o LifeTrack_Android_Project.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/LifeTrack_Android_Project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeTrack-APK
          path: extracted/LifeTrack_Android_Project/app/build/outputs/apk/debug/app-debug.apk
