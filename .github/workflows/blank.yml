name: Build LifeTrack APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LifeTrack_Android_Project_fixed.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -o LifeTrack_Android_Project_fixed.zip -d extracted
          find extracted -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          echo "Building project in $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeTrack-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
